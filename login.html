<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baibesik.kz — Войти</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--orange-dark:#c2410c;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;background:var(--dark);min-height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#1a0800 0%,#0f172a 50%,#1e293b 100%);z-index:0}

.top-bar{position:relative;z-index:10;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--orange);letter-spacing:2px;text-decoration:none}
.logo span{color:#fff}
.lang-btns{display:flex;gap:6px}
.lang-btn{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Noto Sans',sans-serif}
.lang-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:10}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.5)}

/* MODE TABS */
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.3)}
.mode-tab{padding:16px;text-align:center;cursor:pointer;transition:all .2s;border:none;font-family:'Noto Sans',sans-serif}
.mode-tab.customer{color:#94a3b8}
.mode-tab.staff{color:#94a3b8}
.mode-tab.active.customer{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff}
.mode-tab.active.staff{background:linear-gradient(135deg,var(--blue),#1d4ed8);color:#fff}
.mode-icon{font-size:22px;display:block;margin-bottom:4px}
.mode-name{font-size:12px;font-weight:800}
.mode-sub{font-size:10px;opacity:.8;margin-top:2px}

.card-body{padding:24px}

.fg{margin-bottom:14px}
.fg-lbl{font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.phone-wrap{display:flex;gap:8px}
.phone-prefix{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 13px;color:#94a3b8;font-size:14px;font-weight:700;white-space:nowrap}
.fg-inp-wrap{position:relative}
.fg-inp{width:100%;padding:11px 13px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;font-family:'Noto Sans',sans-serif;color:#fff;outline:none;transition:all .2s}
.fg-inp::placeholder{color:#475569}
.fg-inp:focus{border-color:var(--orange)}
.fg-inp.staff-mode:focus{border-color:var(--blue)}
.fg-inp-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#64748b;cursor:pointer}

.forgot{text-align:right;margin:-6px 0 14px}
.forgot a{font-size:12px;color:#475569;text-decoration:none}
.forgot a:hover{color:#64748b}

/* STAFF INFO BOX */
.staff-info{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:13px;margin-bottom:16px;display:none}
.staff-info.show{display:block}
.si-title{font-size:12px;font-weight:800;color:#60a5fa;margin-bottom:4px}
.si-text{font-size:11px;color:#94a3b8;line-height:1.5}

/* BUTTONS */
.btn-customer{width:100%;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:all .2s;letter-spacing:.5px}
.btn-customer:hover{opacity:.9}
.btn-staff{width:100%;background:linear-gradient(135deg,var(--blue),#1d4ed8);color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:all .2s;letter-spacing:.5px}
.btn-staff:hover{opacity:.9}
.btn-main:disabled,.btn-customer:disabled,.btn-staff:disabled{opacity:.4;pointer-events:none}

.loading-ring{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.divider{display:flex;align-items:center;gap:12px;margin:16px 0}
.div-line{flex:1;height:1px;background:rgba(255,255,255,.06)}
.div-txt{font-size:11px;color:#475569;font-weight:600}

.link-row{text-align:center;font-size:13px;color:#64748b}
.link-row a{color:var(--orange);text-decoration:none;font-weight:700}

.alert{border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700;margin-bottom:14px;display:none;align-items:center;gap:8px}
.alert.show{display:flex}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#6ee7b7}

footer{position:relative;z-index:10;text-align:center;padding:16px;font-size:11px;color:#334155}
</style>
</head>
<body>
<div class="bg"></div>

<div class="top-bar">
  <a href="index.html" class="logo">BAI<span>BESIK</span></a>
  <div class="lang-btns">
    <button class="lang-btn active" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('kk')">KK</button>
  </div>
</div>

<div class="main">
  <div class="card">

    <!-- MODE TABS -->
    <div class="mode-tabs">
      <button class="mode-tab customer active" id="tab-customer" onclick="setMode('customer')">
        <span class="mode-icon">🛒</span>
        <div class="mode-name" id="tab-cust-name">Покупатель</div>
        <div class="mode-sub" id="tab-cust-sub">Войти / Зарегистрироваться</div>
      </button>
      <button class="mode-tab staff" id="tab-staff" onclick="setMode('staff')">
        <span class="mode-icon">🏪</span>
        <div class="mode-name" id="tab-staff-name">Сотрудник</div>
        <div class="mode-sub" id="tab-staff-sub">Менеджер / Склад</div>
      </button>
    </div>

    <div class="card-body">

      <div class="alert alert-error" id="alert-err">⚠️ <span id="alert-msg"></span></div>
      <div class="alert alert-success" id="alert-ok">✅ <span id="alert-ok-msg"></span></div>

      <!-- STAFF INFO -->
      <div class="staff-info" id="staff-info">
        <div class="si-title" id="si-title">🔐 Вход для сотрудников</div>
        <div class="si-text" id="si-text">Аккаунт создаётся владельцем или менеджером магазина. Если у вас нет аккаунта — обратитесь к руководителю.</div>
      </div>

      <!-- PHONE -->
      <div class="fg">
        <label class="fg-lbl" id="lbl-ph">Номер телефона</label>
        <div class="phone-wrap">
          <div class="phone-prefix">+7</div>
          <input class="fg-inp" id="inp-ph" type="tel" placeholder="707 123 4567" maxlength="11" inputmode="numeric">
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="fg">
        <label class="fg-lbl" id="lbl-pw">Пароль</label>
        <div class="fg-inp-wrap">
          <input class="fg-inp" id="inp-pw" type="password" placeholder="••••••••">
          <span class="fg-inp-icon" onclick="togglePw()">👁</span>
        </div>
      </div>

      <div class="forgot"><a href="#" id="forgot-lnk">Забыли пароль?</a></div>

      <!-- LOGIN BUTTON (динамический) -->
      <button class="btn-customer" id="btn-login" onclick="doLogin()">
        <span id="btn-txt">Войти →</span>
      </button>

      <!-- Только для покупателей -->
      <div id="customer-extras">
        <div class="divider">
          <div class="div-line"></div>
          <span class="div-txt" id="div-txt">или</span>
          <div class="div-line"></div>
        </div>
        <div class="link-row">
          <span id="no-acc">Нет аккаунта?</span> <a href="register.html" id="reg-lnk">Зарегистрироваться</a>
        </div>
      </div>

    </div>
  </div>
</div>
<footer>© 2026 Baibesik.kz</footer>

<script>
const SUPABASE_URL = 'https://fciofuexujtxxjlamxno.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjaW9mdWV4dWp0eHhqbGFteG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTYwOTcsImV4cCI6MjA5NTczMjA5N30.dDvtfabQ6xHmSd5NDntme2ggJpzNKLtXovFFDW2Kc80';

const ROUTES = {
  super_admin:'admin.html',
  store_owner:'vendor.html',
  manager:'vendor.html',
  warehouse:'depo_panel.html',
  wholesale:'toptanci_dashboard.html',
  customer:'musteri_dashboard.html',
};

const T = {
  ru:{
    'tab-cust-name':'Покупатель','tab-cust-sub':'Войти / Зарегистрироваться',
    'tab-staff-name':'Сотрудник','tab-staff-sub':'Менеджер / Склад',
    'si-title':'🔐 Вход для сотрудников',
    'si-text':'Аккаунт создаётся владельцем магазина. Если нет — обратитесь к руководителю.',
    'lbl-ph':'Номер телефона','lbl-pw':'Пароль',
    'forgot-lnk':'Забыли пароль?',
    'div-txt':'или','no-acc':'Нет аккаунта?','reg-lnk':'Зарегистрироваться',
    btn_cust:'Войти →',btn_staff:'Войти как сотрудник →',
    err_fill:'Введите телефон и пароль',
    err_phone:'Введите номер телефона',
    err_wrong:'Неверный телефон или пароль',
    err_role:'Нет доступа для этого типа входа',
    ok_login:'Вход выполнен! Перенаправляем...',
  },
  kk:{
    'tab-cust-name':'Сатып алушы','tab-cust-sub':'Кіру / Тіркелу',
    'tab-staff-name':'Қызметкер','tab-staff-sub':'Менеджер / Қойма',
    'si-title':'🔐 Қызметкерлерге кіру',
    'si-text':'Аккаунтты дүкен иесі жасайды. Болмаса — жетекшіге хабарласыңыз.',
    'lbl-ph':'Телефон нөмірі','lbl-pw':'Құпия сөз',
    'forgot-lnk':'Құпия сөзді ұмыттыңыз ба?',
    'div-txt':'немесе','no-acc':'Аккаунт жоқ па?','reg-lnk':'Тіркелу',
    btn_cust:'Кіру →',btn_staff:'Қызметкер ретінде кіру →',
    err_fill:'Телефон мен құпия сөзді енгізіңіз',
    err_phone:'Телефон нөмірін енгізіңіз',
    err_wrong:'Қате телефон немесе құпия сөз',
    err_role:'Бұл кіру түріне рұқсат жоқ',
    ok_login:'Кіру сәтті! Бағытталуда...',
  }
};

let lang='ru';
let mode='customer'; // 'customer' or 'staff'

// URL param: ?staff=1 → автоматически открыть вкладку сотрудника
const params = new URLSearchParams(window.location.search);
if(params.get('staff')==='1') setMode('staff');

function d(){return T[lang];}
function $(id){return document.getElementById(id);}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===l));
  const d_=d();
  ['tab-cust-name','tab-cust-sub','tab-staff-name','tab-staff-sub',
   'si-title','si-text','lbl-ph','lbl-pw','forgot-lnk',
   'div-txt','no-acc','reg-lnk'].forEach(k=>{
    const el=$(k);if(el)el.textContent=d_[k]||'';
  });
  // Update button text
  $('btn-txt').textContent = mode==='customer' ? d_.btn_cust : d_.btn_staff;
}

function setMode(m){
  mode=m;
  const isStaff = m==='staff';
  const d_=d();

  // Tabs
  $('tab-customer').classList.toggle('active', !isStaff);
  $('tab-staff').classList.toggle('active', isStaff);

  // Button style + text
  const btn=$('btn-login');
  btn.className = isStaff ? 'btn-staff' : 'btn-customer';
  $('btn-txt').textContent = isStaff ? d_.btn_staff : d_.btn_cust;

  // Staff info
  $('staff-info').classList.toggle('show', isStaff);

  // Hide register link for staff
  $('customer-extras').style.display = isStaff ? 'none' : 'block';

  // Input focus color
  $('inp-ph').className = 'fg-inp' + (isStaff?' staff-mode':'');
  $('inp-pw').className = 'fg-inp' + (isStaff?' staff-mode':'');

  hideAlerts();
}

function togglePw(){const el=$('inp-pw');el.type=el.type==='password'?'text':'password';}
function showErr(msg){$('alert-msg').textContent=msg;$('alert-err').classList.add('show');$('alert-ok').classList.remove('show');}
function showOk(msg){$('alert-ok-msg').textContent=msg;$('alert-ok').classList.add('show');$('alert-err').classList.remove('show');}
function hideAlerts(){$('alert-err').classList.remove('show');$('alert-ok').classList.remove('show');}

async function doLogin(){
  const d_=d();
  const ph=$('inp-ph').value.replace(/\D/g,'');
  const pw=$('inp-pw').value;

  hideAlerts();
  if(!ph||!pw){showErr(d_.err_fill);return;}
  if(ph.length<9){showErr(d_.err_phone);return;}

  const btn=$('btn-login');
  btn.disabled=true;
  $('btn-txt').innerHTML='<span class="loading-ring"></span>';

  try{
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);

    const {data,error}=await sb.auth.signInWithPassword({
      email:ph+'@baibesik.kz', password:pw
    });

    if(error){showErr(d_.err_wrong);btn.disabled=false;$('btn-txt').textContent=mode==='staff'?d_.btn_staff:d_.btn_cust;return;}

    const {data:user}=await sb.from('users').select('role,full_name').eq('id',data.user.id).single();
    const role=user?.role||'customer';

    // Rol kontrolü
    const staffRoles=['super_admin','store_owner','manager','warehouse'];
    const customerRoles=['customer','wholesale'];

    if(mode==='staff' && customerRoles.includes(role)){
      showErr(d_.err_role);
      await sb.auth.signOut();
      btn.disabled=false;$('btn-txt').textContent=d_.btn_staff;
      return;
    }
    if(mode==='customer' && staffRoles.includes(role)){
      // Admin girişi customer tabından → yine de yönlendir
    }

    showOk(`${d_.ok_login} ${user?.full_name||''}`);
    setTimeout(()=>window.location.href=ROUTES[role]||'musteri_dashboard.html',1000);

  }catch(e){
    showErr(e.message||d_.err_wrong);
    btn.disabled=false;
    $('btn-txt').textContent=mode==='staff'?d()['btn_staff']:d()['btn_cust'];
  }
}

// Enter ile giriş
document.addEventListener('DOMContentLoaded',()=>{
  $('inp-ph').addEventListener('keydown',e=>{if(e.key==='Enter')$('inp-pw').focus();});
  $('inp-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  $('inp-ph').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,11);});
});

window.setLang=setLang;
window.setMode=setMode;
window.togglePw=togglePw;
window.doLogin=doLogin;
</script>
</body>
</html>
