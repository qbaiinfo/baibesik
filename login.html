<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baibesik.kz — Войти</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--orange-dark:#c2410c;--dark:#0f172a;--dark2:#1e293b;--green:#10b981;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;background:var(--dark);min-height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#1a0a00 0%,#0f172a 50%,#1e293b 100%);z-index:0}

.top-bar{position:relative;z-index:10;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--orange);letter-spacing:2px;text-decoration:none}
.logo span{color:#fff}
.lang-btns{display:flex;gap:6px}
.lang-btn{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Noto Sans',sans-serif}
.lang-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:10}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.card-head{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-dark) 100%);padding:28px;text-align:center}
.card-icon{font-size:36px;margin-bottom:8px}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:2px}
.card-sub{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
.card-body{padding:28px}

.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.role-chip{border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.03)}
.role-chip:hover{border-color:var(--orange)}
.role-chip.selected{border-color:var(--orange);background:rgba(249,115,22,.1)}
.role-icon{font-size:22px;display:block;margin-bottom:4px}
.role-name{font-size:12px;font-weight:700;color:#fff}
.role-sub{font-size:10px;color:#64748b;margin-top:1px}
.role-chip.selected .role-name{color:var(--orange)}

.fg{margin-bottom:14px}
.fg-lbl{font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.phone-wrap{display:flex;gap:8px}
.phone-prefix{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;color:#94a3b8;font-size:14px;font-weight:700}
.fg-inp-wrap{position:relative}
.fg-inp{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;font-family:'Noto Sans',sans-serif;color:#fff;outline:none;transition:all .2s}
.fg-inp::placeholder{color:#475569}
.fg-inp:focus{border-color:var(--orange)}
.fg-inp-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#64748b;cursor:pointer}

.forgot{text-align:right;margin-bottom:16px;margin-top:-8px}
.forgot a{font-size:12px;color:#64748b;text-decoration:none}

.btn-main{width:100%;background:linear-gradient(135deg,var(--orange) 0%,var(--orange-dark) 100%);color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Noto Sans',sans-serif;letter-spacing:.5px;transition:all .2s}
.btn-main:hover{opacity:.9}
.btn-main:disabled{opacity:.4;pointer-events:none}
.loading-ring{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.div-line{flex:1;height:1px;background:rgba(255,255,255,.08)}
.div-txt{font-size:12px;color:#64748b;font-weight:600}

.link-row{text-align:center;font-size:13px;color:#64748b}
.link-row a{color:var(--orange);text-decoration:none;font-weight:700}

.alert{border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:none;align-items:center;gap:8px}
.alert.show{display:flex}
.alert-error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.alert-success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#6ee7b7}

/* DEMO */
.demo-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-top:16px}
.demo-title{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.demo-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.demo-item:last-child{border-bottom:none}
.demo-item:hover{opacity:.8}
.demo-role{font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.demo-ph{font-size:11px;color:#64748b;font-family:monospace}
.demo-fill{font-size:10px;font-weight:700;color:var(--orange);background:rgba(249,115,22,.1);padding:2px 8px;border-radius:4px}

footer{position:relative;z-index:10;text-align:center;padding:16px;font-size:11px;color:#334155}
</style>
</head>
<body>
<div class="bg"></div>

<div class="top-bar">
  <a href="index.html" class="logo">BAI<span>BESIK</span></a>
  <div class="lang-btns">
    <button class="lang-btn active" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('kk')">KK</button>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-head">
      <div class="card-icon">🔐</div>
      <div class="card-title" id="card-title">ВОЙТИ В АККАУНТ</div>
      <div class="card-sub" id="card-sub">Baibesik.kz — Байбесік базары</div>
    </div>
    <div class="card-body">

      <div style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px" id="role-lbl">Кто вы?</div>
      <div class="role-grid" id="role-grid"></div>

      <div class="alert alert-error" id="alert-err">⚠️ <span id="alert-msg"></span></div>
      <div class="alert alert-success" id="alert-ok">✅ <span id="alert-ok-msg"></span></div>

      <div class="fg">
        <label class="fg-lbl" id="lbl-ph">Номер телефона</label>
        <div class="phone-wrap">
          <div class="phone-prefix">+7</div>
          <input class="fg-inp" id="inp-ph" type="tel" placeholder="707 123 4567" maxlength="10" inputmode="numeric">
        </div>
      </div>

      <div class="fg">
        <label class="fg-lbl" id="lbl-pw">Пароль</label>
        <div class="fg-inp-wrap">
          <input class="fg-inp" id="inp-pw" type="password" placeholder="••••••••">
          <span class="fg-inp-icon" onclick="togglePw()">👁</span>
        </div>
      </div>

      <div class="forgot"><a href="#" id="forgot-lnk">Забыли пароль?</a></div>

      <button class="btn-main" id="btn-login" onclick="doLogin()">
        <span id="btn-txt">Войти →</span>
      </button>

      <div class="divider">
        <div class="div-line"></div>
        <span class="div-txt" id="div-txt">или</span>
        <div class="div-line"></div>
      </div>

      <div class="link-row"><span id="no-acc">Нет аккаунта?</span> <a href="register.html" id="reg-lnk">Зарегистрироваться</a></div>

      <div class="demo-box">
        <div class="demo-title" id="demo-ttl">🧪 Тестовые аккаунты</div>
        <div id="demo-list"></div>
      </div>

    </div>
  </div>
</div>
<footer>© 2026 Baibesik.kz</footer>

<script>
// ─── CONFIG — BURAYA KENDİ KEY'İNİ YAZ ───────────────────────────────────
const SUPABASE_URL = 'https://fciofuexujtxxjlamxno.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjaW9mdWV4dWp0eHhqbGFteG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTYwOTcsImV4cCI6MjA5NTczMjA5N30.dDvtfabQ6xHmSd5NDntme2ggJpzNKLtXovFFDW2Kc80'; // eyJ... ile başlayan key
// ─────────────────────────────────────────────────────────────────────────

const ROLES=[
  {id:'customer', icon:'🛒', ru:'Покупатель',  kk:'Сатып алушы', sub_ru:'Розничный',         sub_kk:'Бөлшек'},
  {id:'wholesale',icon:'📦', ru:'Оптовик',     kk:'Көтермеші',   sub_ru:'Оптовый',           sub_kk:'Көтерме'},
  {id:'manager',  icon:'🏪', ru:'Менеджер',    kk:'Менеджер',    sub_ru:'Сотрудник магазина', sub_kk:'Дүкен қызметкері'},
  {id:'warehouse',icon:'🏭', ru:'Склад',       kk:'Қойма',       sub_ru:'Складской',         sub_kk:'Қойма жұмысшысы'},
];

const DEMOS=[
  {icon:'🛒',ph:'7001111111',pw:'test123',ru:'Покупатель',   kk:'Сатып алушы'},
  {icon:'📦',ph:'7002222222',pw:'test123',ru:'Оптовик',      kk:'Көтермеші'},
  {icon:'🏪',ph:'7003333333',pw:'test123',ru:'Менеджер',     kk:'Менеджер'},
  {icon:'🏭',ph:'7004444444',pw:'test123',ru:'Склад',        kk:'Қойма'},
];

const ROUTES={customer:'musteri_dashboard.html',wholesale:'toptanci_dashboard.html',manager:'vendor.html',warehouse:'depo_panel.html',super_admin:'admin.html',store_owner:'vendor.html'};

const T={
  ru:{'card-title':'ВОЙТИ В АККАУНТ','card-sub':'Baibesik.kz — Байбесік базары','role-lbl':'Кто вы?','lbl-ph':'Номер телефона','lbl-pw':'Пароль','forgot-lnk':'Забыли пароль?','btn-txt':'Войти →','div-txt':'или','no-acc':'Нет аккаунта?','reg-lnk':'Зарегистрироваться','demo-ttl':'🧪 Тестовые аккаунты',err_empty:'Заполните телефон и пароль',err_phone:'Введите 10-значный номер',err_wrong:'Неверный телефон или пароль',ok_login:'Вход выполнен! Перенаправляем...',fill_txt:'Заполнить'},
  kk:{'card-title':'АККАУНТҚА КІРу','card-sub':'Baibesik.kz — Байбесік базары','role-lbl':'Сіз кімсіз?','lbl-ph':'Телефон нөмірі','lbl-pw':'Құпия сөз','forgot-lnk':'Құпия сөзді ұмыттыңыз ба?','btn-txt':'Кіру →','div-txt':'немесе','no-acc':'Аккаунт жоқ па?','reg-lnk':'Тіркелу','demo-ttl':'🧪 Тест аккаунттары',err_empty:'Телефон мен құпия сөзді толтырыңыз',err_phone:'10 санды нөмір енгізіңіз',err_wrong:'Қате телефон немесе құпия сөз',ok_login:'Кіру сәтті! Бағытталуда...',fill_txt:'Толтыру'},
};

let lang='ru', selRole='customer';
function d(){return T[lang];}
function $(id){return document.getElementById(id);}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===l));
  ['card-title','card-sub','role-lbl','lbl-ph','lbl-pw','forgot-lnk','btn-txt','div-txt','no-acc','reg-lnk','demo-ttl'].forEach(k=>{const el=$(k);if(el)el.textContent=d()[k]||'';});
  renderRoles();renderDemo();
}

function renderRoles(){
  $('role-grid').innerHTML=ROLES.map(r=>`
    <div class="role-chip${selRole===r.id?' selected':''}" onclick="selRole='${r.id}';renderRoles()">
      <span class="role-icon">${r.icon}</span>
      <div class="role-name">${lang==='ru'?r.ru:r.kk}</div>
      <div class="role-sub">${lang==='ru'?r.sub_ru:r.sub_kk}</div>
    </div>`).join('');
}

function renderDemo(){
  $('demo-list').innerHTML=DEMOS.map(a=>`
    <div class="demo-item" onclick="fillDemo('${a.ph}','${a.pw}')">
      <div class="demo-role">${a.icon} ${lang==='ru'?a.ru:a.kk}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="demo-ph">+7 ${a.ph.slice(1)}</span>
        <span class="demo-fill">${d().fill_txt}</span>
      </div>
    </div>`).join('');
}

function fillDemo(ph,pw){$('inp-ph').value=ph;$('inp-pw').value=pw;hideAlerts();}
function togglePw(){const el=$('inp-pw');el.type=el.type==='password'?'text':'password';}
function showErr(msg){$('alert-msg').textContent=msg;$('alert-err').classList.add('show');$('alert-ok').classList.remove('show');}
function showOk(msg){$('alert-ok-msg').textContent=msg;$('alert-ok').classList.add('show');$('alert-err').classList.remove('show');}
function hideAlerts(){$('alert-err').classList.remove('show');$('alert-ok').classList.remove('show');}

async function doLogin(){
  const d_=d();
  hideAlerts();
  const ph=$('inp-ph').value.replace(/\D/g,'');
  const pw=$('inp-pw').value;
  if(!ph||!pw){showErr(d_.err_empty);return;}
  if(ph.length<10){showErr(d_.err_phone);return;}

  const btn=$('btn-login');
  btn.disabled=true;
  $('btn-txt').innerHTML='<span class="loading-ring"></span>';

  try{
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);

    const {data,error}=await sb.auth.signInWithPassword({email:ph+'@baibesik.kz',password:pw});

    if(error){showErr(d_.err_wrong);btn.disabled=false;$('btn-txt').textContent=d_['btn-txt'];return;}

    const {data:user}=await sb.from('users').select('role,full_name').eq('id',data.user.id).single();
    showOk(`${d_.ok_login} ${user?.full_name||''}`);
    setTimeout(()=>{window.location.href=ROUTES[user?.role]||'musteri_dashboard.html';},1200);

  }catch(e){
    showErr(e.message||d_.err_wrong);
    btn.disabled=false;$('btn-txt').textContent=d()['btn-txt'];
  }
}

$('inp-ph').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,10);});
$('inp-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('inp-ph').addEventListener('keydown',e=>{if(e.key==='Enter')$('inp-pw').focus();});

renderRoles();
renderDemo();
</script>
</body>
</html>
