<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baibesik.kz — Каталог BMT</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --orange:#f97316; --orange-dark:#c2410c; --orange-light:#fff7ed;
  --dark:#0f172a; --dark2:#1e293b; --gray:#64748b;
  --border:#e2e8f0; --light:#f8fafc; --white:#fff;
  --green:#10b981; --red:#ef4444; --blue:#3b82f6;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;background:var(--light);color:var(--dark)}

/* HEADER */
header{background:var(--dark2);position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.3)}
.hi{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--orange);letter-spacing:2px;text-decoration:none;flex-shrink:0}
.logo span{color:#fff}
.search-bar{flex:1;display:flex;background:#fff;border-radius:8px;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.search-bar:focus-within{border-color:var(--orange)}
.search-bar input{flex:1;padding:9px 14px;border:none;outline:none;font-size:14px;font-family:'Noto Sans',sans-serif}
.search-bar button{background:var(--orange);color:#fff;border:none;padding:9px 16px;cursor:pointer;font-size:15px}
.hr{display:flex;gap:8px;align-items:center;flex-shrink:0}
.lang-btn{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.12);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;font-family:'Noto Sans',sans-serif;transition:all .2s}
.lang-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.back-btn{color:#94a3b8;text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;border:1px solid rgba(255,255,255,.1);border-radius:6px;transition:all .2s}
.back-btn:hover{color:var(--orange);border-color:var(--orange)}
.cart-btn{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:16px;position:relative}
.cart-count{position:absolute;top:-5px;right:-5px;background:var(--orange);color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}

/* BREADCRUMB */
.bc{background:#fff;border-bottom:1px solid var(--border)}
.bc-inner{max-width:1280px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray);flex-wrap:wrap}
.bc-inner a{color:var(--gray);text-decoration:none}
.bc-inner a:hover{color:var(--orange)}
.bc-sep{color:#cbd5e1}
.bc-cur{color:var(--dark);font-weight:700}

/* MOBILE CAT TOGGLE */
.mob-toggle{display:none;width:100%;background:var(--dark);color:#fff;border:none;padding:12px 16px;font-family:'Noto Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:left}

/* LAYOUT */
.layout{max-width:1280px;margin:0 auto;padding:18px 16px;display:grid;grid-template-columns:270px 1fr;gap:18px}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:12px}
.sb-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sb-head{background:var(--dark);color:var(--orange);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;padding:11px 14px;display:flex;align-items:center;gap:8px}
.cat-list{list-style:none}
.cat-item{border-bottom:1px solid var(--border)}
.cat-item:last-child{border-bottom:none}
.cat-btn{width:100%;background:none;border:none;padding:9px 14px;text-align:left;cursor:pointer;font-family:'Noto Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--dark);display:flex;justify-content:space-between;align-items:center;gap:6px;transition:all .15s}
.cat-btn:hover{background:var(--orange-light);color:var(--orange-dark)}
.cat-btn.active{background:var(--orange);color:#fff}
.cat-btn.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.cnt{background:#f1f5f9;color:var(--gray);font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;flex-shrink:0}
.cat-icon{display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}

/* FILTER */
.fi-group{padding:12px 14px;border-bottom:1px solid var(--border)}
.fi-group:last-child{border-bottom:none}
.fi-lbl{font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--dark);background:#fff;font-family:'Noto Sans',sans-serif;transition:all .15s}
.chip:hover{border-color:var(--orange);color:var(--orange)}
.chip.active{background:var(--orange);border-color:var(--orange);color:#fff}
.price-row{display:flex;gap:8px;align-items:center}
.price-inp{flex:1;padding:7px 9px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-family:'Noto Sans',sans-serif;outline:none;transition:border-color .2s}
.price-inp:focus{border-color:var(--orange)}
.btn-apply{width:100%;background:var(--orange);color:#fff;border:none;padding:9px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans',sans-serif;margin-top:8px;transition:background .2s}
.btn-apply:hover{background:var(--orange-dark)}

/* MAIN */
.main{display:flex;flex-direction:column;gap:14px}

/* BANNER */
.banner{background:linear-gradient(135deg,var(--dark) 0%,var(--dark2) 100%);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px}
.banner-icon{font-size:32px}
.banner-info{flex:1}
.banner-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:1px}
.banner-sub{font-size:12px;color:#94a3b8;margin-top:2px}
.banner-right{text-align:right;flex-shrink:0}
.banner-cnt{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--orange);display:block}
.banner-cnt-lbl{font-size:11px;color:#64748b}
/* BMT badge */
.bmt-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);color:var(--orange);font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-left:10px;vertical-align:middle}

/* TOOLBAR */
.toolbar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.res-cnt{font-size:13px;color:var(--gray);font-weight:600}
.res-cnt strong{color:var(--dark)}
.cust-toggle{display:flex;background:var(--light);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ct-btn{border:none;background:none;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans',sans-serif;color:var(--gray);transition:all .2s}
.ct-btn.active{background:var(--dark);color:var(--orange)}
.tl-right{display:flex;align-items:center;gap:8px}
.sort-sel{border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans',sans-serif;font-weight:600;outline:none;cursor:pointer}
.view-btns{display:flex;gap:4px}
.vb{border:1.5px solid var(--border);background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px;transition:all .15s}
.vb.active{background:var(--orange);border-color:var(--orange);color:#fff}

/* GRID */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:13px}
.prod-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s;cursor:pointer}
.prod-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px);border-color:#cbd5e1}
.pimg{aspect-ratio:1;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;overflow:visible}
.pbadge{position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px}
.pb-heavy{background:var(--dark);color:#fbbf24}
.pb-pack{background:#dbeafe;color:#1d4ed8}
.pb-new{background:var(--green);color:#fff}
.pbody{padding:10px 12px}
.pname{font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:3px;line-height:1.3}
.pspec{font-size:11px;color:var(--gray);margin-bottom:4px;line-height:1.4}
.pcode{font-size:10px;color:#94a3b8;font-weight:700;font-family:monospace;margin-bottom:6px}
.pfooter{display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.pprices{display:flex;flex-direction:column}
.price-ret{font-size:15px;font-weight:900;color:var(--orange-dark)}
.price-ws{font-size:11px;color:var(--green);font-weight:700}
.price-pack{font-size:10px;color:#94a3b8;font-weight:600}
.btn-cart{background:var(--orange);color:#fff;border:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;font-family:'Noto Sans',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-cart:hover{background:var(--orange-dark)}
.btn-cart.added{background:var(--green)}

/* LIST VIEW */
.list-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;display:flex;align-items:center;gap:14px;transition:all .2s}
.list-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.06);border-color:#cbd5e1}
.list-icon{width:64px;height:64px;background:var(--light);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.list-info{flex:1}
.list-name{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:3px}
.list-spec{font-size:12px;color:var(--gray)}
.list-code{font-size:11px;color:#94a3b8;font-family:monospace;margin-top:2px}
.list-right{text-align:right;flex-shrink:0}

/* EMPTY */
.empty{text-align:center;padding:56px;color:var(--gray);grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-text{font-size:14px;font-weight:600}

/* PAGINATION */
.pagination{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.pg-btn{border:1.5px solid var(--border);background:#fff;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Noto Sans',sans-serif;transition:all .15s;color:var(--dark)}
.pg-btn:hover{border-color:var(--orange);color:var(--orange)}
.pg-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}

/* RESPONSIVE */
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex}.mob-toggle{display:block}}
@media(max-width:600px){.prod-grid{grid-template-columns:repeat(2,1fr)}.hi{flex-wrap:wrap}.search-bar{order:3;width:100%}}
</style>

<header>

    <a href="index.html" class="logo">BAI<span>BESIK</span></a>
    <div class="search-bar">
      <input type="text" id="s-inp" placeholder="Петли, направляющие, ручки Blum..." oninput="doFilter()">
      <button onclick="doFilter()">🔍</button>
    </div>
    <div class="hr">
      <a href="index.html" class="back-btn" id="back-lnk">← Главная</a>
      <button class="lang-btn active" onclick="setLang('kk')" data-lang="kk">RU</button>
      <button class="lang-btn" onclick="setLang('ru')" data-lang="ru">KK</button>
      <button class="cart-btn" onclick="window.location.href='checkout_and_orders.html'">🛒<span class="cart-count" id="cc">0</span></button>
    </div>
  </div>
</header>

<div class="bc">
  <div class="bc-inner">
    <a href="index.html" id="bc-home">Главная</a>
    <span class="bc-sep">›</span>
    <span class="bc-cur" id="bc-cat">Каталог BMT</span>
    <span class="bc-sep" id="bc-sep2" style="display:none">›</span>
    <span class="bc-cur" id="bc-sub" style="display:none"></span>
  </div>
</div>

<button class="mob-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰ Категории / Санаттар</button>

<div class="layout">

  <aside class="sidebar">
    <div class="sb-card">
      <div class="sb-head">📂 <span id="sb-cats">Категории</span></div>
      <ul class="cat-list" id="cat-list"></ul>
    </div>
    <div class="sb-card">
      <div class="sb-head">🔧 <span id="sb-fil">Фильтры</span></div>
      <div class="fi-group">
        <div class="fi-lbl" id="f-type">Тип покупателя</div>
        <div class="chips">
          <button class="chip active" id="chip-ret" onclick="setCust('retail',this)" id="chip-ret">Розница</button>
          <button class="chip" id="chip-ws" onclick="setCust('wholesale',this)">Оптом</button>
        </div>
      </div>
      <div class="fi-group">
        <div class="fi-lbl" id="f-heavy">Товары</div>
        <div class="chips">
          <button class="chip active" id="chip-all" onclick="setHeavy('all',this)">Все</button>
          <button class="chip" id="chip-normal" onclick="setHeavy('normal',this)">Обычные</button>
          <button class="chip" id="chip-heavy" onclick="setHeavy('heavy',this)">Самовывоз</button>
        </div>
      </div>
      <div class="fi-group">
        <div class="fi-lbl" id="f-price">Цена за шт (₸)</div>
        <div class="price-row">
          <input type="number" class="price-inp" id="p-min" placeholder="от">
          <span style="color:var(--gray);font-size:12px">—</span>
          <input type="number" class="price-inp" id="p-max" placeholder="до">
        </div>
        <button class="btn-apply" onclick="doFilter()" id="btn-apply">Применить</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <!-- BANNER -->
    <div class="banner">
      <div class="banner-icon" id="b-icon">📦</div>
      <div class="banner-info">
        <div class="banner-title" id="b-title">ВСЕ ТОВАРЫ<span class="bmt-badge">BMT Апрель 2026</span></div>
        <div class="banner-sub" id="b-sub">Реальные цены из прайс-листа — 18 категорий, 150+ позиций</div>
      </div>
      <div class="banner-right">
        <span class="banner-cnt" id="b-cnt">0</span>
        <span class="banner-cnt-lbl" id="b-cnt-lbl">товаров</span>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="tl-left">
        <div class="res-cnt" id="res-cnt">Найдено: <strong>0</strong></div>
        <div class="cust-toggle">
          <button class="ct-btn active" id="tb-ret" onclick="setCust('retail',null)">Розница</button>
          <button class="ct-btn" id="tb-ws" onclick="setCust('wholesale',null)">Опт −20%</button>
        </div>
      </div>
      <div class="tl-right">
        <select class="sort-sel" id="sort-sel" onchange="doFilter()">
          <option value="def" id="s-def">По умолчанию</option>
          <option value="asc" id="s-asc">Цена ↑</option>
          <option value="desc" id="s-desc">Цена ↓</option>
          <option value="name" id="s-name">По названию</option>
        </select>
        <div class="view-btns">
          <button class="vb active" id="vb-grid" onclick="setView('grid')" title="Сетка">⊞</button>
          <button class="vb" id="vb-list" onclick="setView('list')" title="Список">☰</button>
        </div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="prod-grid" id="prod-container"></div>

    <!-- PAGINATION -->
    <div class="pagination" id="pagination"></div>
  </div>
</div>

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===l));
  const d=T[l];
  ['back-lnk','bc-home','bc-cat','sb-cats','sb-fil','f-type','chip-ret','chip-ws',
   'f-heavy','chip-all','chip-normal','chip-heavy','f-price','btn-apply','b-sub',
   'b-cnt-lbl','tb-ret','tb-ws','s-def','s-asc','s-desc','s-name'].forEach(k=>{
    const el=document.getElementById(k);if(el)el.textContent=d[k]||'';
  });
  renderCats(); updateBanner(); doFilter();
}

// ─── CATS ─────────────────────────────────────────────────────────────────────
function catCount(id){
  return id===0 ? PRODS.length : PRODS.filter(p=>p.cat===id).length;
}
function renderCats(){
  document.getElementById('cat-list').innerHTML=CATS.map(c=>`
    <li class="cat-item">
      <button class="cat-btn ${activeCat===c.id?'active':''}" onclick="selCat(${c.id})">
        <span class="cat-icon">${c.icon}</span>
        <span style="flex:1;text-align:left">${lang==='ru'?c.ru:c.kk}</span>
        <span class="cnt">${catCount(c.id)}</span>
      </button>
    </li>`).join('');
}
function selCat(id){
  activeCat=id; page=1;

function updateBanner(){
  const d=T[lang];

    document.getElementById('b-icon').textContent='📦';

// ─── FILTERS ─────────────────────────────────────────────────────────────────
function setCust(t,el){
  cust=t;
  document.getElementById('chip-ret').classList.toggle('active',t==='retail');
  document.getElementById('chip-ws').classList.toggle('active',t==='wholesale');
  document.getElementById('tb-ret').classList.toggle('active',t==='retail');
  document.getElementById('tb-ws').classList.toggle('active',t==='wholesale');
  doFilter();
}
function setHeavy(t,el){
  heavyFilter=t;
  ['chip-all','chip-normal','chip-heavy'].forEach(id=>document.getElementById(id).classList.remove('active'));
  el.classList.add('active');
  doFilter();
}
function setView(v){
  view=v;
  document.getElementById('vb-grid').classList.toggle('active',v==='grid');
  document.getElementById('vb-list').classList.toggle('active',v==='list');
  doFilter();
}

// ─── FILTER + RENDER ─────────────────────────────────────────────────────────
function doFilter(){
  const q=(document.getElementById('s-inp').value||'').toLowerCase().trim();
  const minV=parseFloat(document.getElementById('p-min').value)||0;
  const maxV=parseFloat(document.getElementById('p-max').value)||Infinity;
  const sort=document.getElementById('sort-sel').value;
  const d=T[lang];

  let list=PRODS.filter(p=>{
    if(activeCat!==0 && p.cat!==activeCat) return false;
    const pr=cust==='wholesale'?p.ws:p.price;
    if(pr<minV||pr>maxV) return false;
    if(heavyFilter==='normal' && p.heavy) return false;
    if(heavyFilter==='heavy' && !p.heavy) return false;
    if(q){
      const nm=lang==='ru'?p.ru:p.kk;
      if(!nm.toLowerCase().includes(q)&&!p.spec.toLowerCase().includes(q)&&!p.code.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  if(sort==='asc') list.sort((a,b)=>(cust==='wholesale'?a.ws-b.ws:a.price-b.price));
  else if(sort==='desc') list.sort((a,b)=>(cust==='wholesale'?b.ws-a.ws:b.price-a.price));
  else if(sort==='name') list.sort((a,b)=>(lang==='ru'?a.ru:a.kk).localeCompare(lang==='ru'?b.ru:b.kk));

  // count
  document.getElementById('res-cnt').innerHTML=(d['res-cnt_pre']||'Найдено:')+' <strong>'+list.length+'</strong>';
  document.getElementById('b-cnt').textContent=list.length;

  // paginate
  const total=Math.max(1,Math.ceil(list.length/PER));
  page=Math.min(page,total);
  const paged=list.slice((page-1)*PER,page*PER);

  renderProds(paged,d);
  renderPagination(total);
}

function fmt(n){return n<10?n.toFixed(1):Math.round(n).toLocaleString('ru');}

function renderProds(list,d){
  const c=document.getElementById('prod-container');
  c.className=view==='grid'?'prod-grid':'prod-grid';

  if(!list.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">${lang==='ru'?'Товары не найдены':'Тауарлар табылмады'}</div></div>`;
    return;
  }

  if(view==='list'){
    c.style.gridTemplateColumns='1fr';
    c.innerHTML=list.map(p=>listCard(p,d)).join('');
  } else {
    c.style.gridTemplateColumns='';
    c.innerHTML=list.map(p=>gridCard(p,d)).join('');
  }
}

function gridCard(p,d){
  const price=cust==='wholesale'?p.ws:p.price;
  const name=lang==='ru'?p.ru:p.kk;
  return `
    <div class="prod-card">
      <div class="pimg" style="display:flex;align-items:center;justify-content:center">${p.image_url ? '<img src="'+p.image_url+'" style="width:100%;height:100%;object-fit:cover">' : p.icon}
        ${p.heavy?'<span class="pbadge pb-heavy">'+d.heavy_lbl+'</span>':''}
        ${p.pack_qty>1&&!p.image_url?'<span class="pbadge pb-pack" style="top:'+(p.heavy?'28px':'8px')+'">'+p.pack_qty+'шт/уп</span>':''}
      </div>
      <div class="pbody">
        <div class="pcode">${p.code}</div>
        <div class="pname">${name}</div>
        <div class="pspec">${p.spec}</div>
        <div class="pfooter">
          <div class="pprices">
            <span class="price-ret">${fmt(price)} ₸</span>
            ${cust==='wholesale'?`<span class="price-ws" style="color:var(--green);font-weight:900">📦 ${fmt(p.ws)} ₸</span>`:`<span style="font-size:10px;color:var(--gray)">${d.ws_contact||'Опт: у менеджера'}</span>`}
            ${p.pack_qty>1?`<span class="price-pack">уп. ${p.pack_price.toLocaleString('ru')} ₸ (${p.pack_qty}шт)</span>`:''}
          </div>
          <button class="btn-cart" id="cb-${p.id}" onclick="addCart(${p.id},event)">${d.add}</button>
        </div>
      </div>
    </div>`;
}

function listCard(p,d){
  const price=cust==='wholesale'?p.ws:p.price;
  const name=lang==='ru'?p.ru:p.kk;
  return `
    <div class="list-card">
      <div class="list-icon">${p.icon}</div>
      <div class="list-info">
        <div class="list-name">${name} ${p.heavy?`<span style="color:var(--red);font-size:11px">${d.heavy_lbl}</span>`:''}</div>
        <div class="list-spec">${p.spec}</div>
        <div class="list-code">${p.code}</div>
      </div>
      <div class="list-right">
        <div class="price-ret">${fmt(price)} ₸</div>
        ${cust==='retail'?`<div class="price-ws">${d.ws_lbl} ${fmt(p.ws)} ₸</div>`:''}
        ${p.pack_qty>1?`<div class="price-pack">уп. ${p.pack_price.toLocaleString('ru')} ₸ (${p.pack_qty}шт)</div>`:''}
        <button class="btn-cart" style="margin-top:6px" id="cb-${p.id}" onclick="addCart(${p.id},event)">${d.add}</button>
      </div>
    </div>`;
}

function renderPagination(total){
  const pg=document.getElementById('pagination');
  if(total<=1){pg.innerHTML='';return;}
  pg.innerHTML=Array.from({length:total},(_,i)=>i+1).map(i=>
    `<button class="pg-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`
  ).join('');
}
function goPage(p){page=p;doFilter();window.scrollTo({top:0,behavior:'smooth'});}

// ─── CART ────────────────────────────────────────────────────────────────────
function addCart(id,e){
  if(e) e.stopPropagation();
  const p = PRODS.find(x=>x.id===id);
  if(!p) return;
  
  // Cart modülü ile ekle (localStorage)
  Cart.add({
    id: p.id,
    storeId: p.storeId || 'aaaaaaaa-0000-0000-0000-000000000001',
    storeName: p.store_name || 'TEST Mağaza (Silinebilir)',
    icon: p.icon,
    ru: p.ru,
    kk: p.kk,
    spec: p.spec||'',
    price: cust==='wholesale' ? p.ws : p.price,
    ws: p.ws,
    pack_qty: p.pack_qty||1,
    pack_price: p.pack_price||p.price,
    heavy: p.heavy||false,
    is_db: p.is_db||false,
  });
  
  // UI güncelle
  cartN = Cart.count();
  const cc = document.getElementById('cc');
  if(cc){ cc.textContent = cartN; cc.style.display = cartN>0?'flex':'none'; }
  
  const btn=document.getElementById('cb-'+id);
  if(btn){
    btn.textContent='✓ '+T[lang].added;
    btn.style.background='var(--green)';btn.style.color='#fff';
    setTimeout(()=>{btn.textContent=T[lang].add;btn.style.background='';btn.style.color='';},1400);
  }
}

async function loadSupabaseProducts() {

    const {data:products, error} = await sb
      .from('products')
      .select('*, categories(name_ru, name_kk), stores(name)')
      .eq('is_active', true)

    if(error || !products || products.length === 0) {

    document.getElementById('b-sub').textContent = lang==='ru' ? 'Ürünler Supabase\'den yükleniyor...' : 'Тауарлар жүктелуде...';
    console.log('Supabase ürün yok');

    }

    // Supabase ürünlerini PRODS formatına çevir

      id: 9000 + i,
      cat: p.category_id || 0,
      code: p.code || '',
      icon: getCatIcon(p.category_id),
      ru: p.name_ru,
      kk: p.name_kk || p.name_ru,
      spec: p.spec || '',
      price: parseFloat(p.price_retail),
      ws: parseFloat(p.price_wholesale || p.price_retail * 0.8),
      pack_qty: p.pack_qty || 1,
      pack_price: parseFloat(p.pack_price || p.price_retail),
      heavy: p.is_heavy || false,
      image_url: p.image_url || null,
      store_name: p.stores?.name || '',
      is_db: true, // Supabase'den geldiğini işaretle
    }));

    // Supabase ürünlerini listenin başına ekle
    PRODS.unshift(...dbProds);

    // Kategori sayılarını güncelle
    renderCats();
    doFilter();

    // Banner güncelle
    document.getElementById('b-sub').textContent =
      `${lang==='ru'?'Реальные товары BMT + магазинов':'BMT нақты тауарлары'} — ${PRODS.length} ${lang==='ru'?'позиций':'позиция'}`;

    console.log(`✅ ${dbProds.length} ürün Supabase'den yüklendi`);

  } catch(e) {
    console.log('Supabase bağlantı hatası, demo data kullanılıyor:', e.message);
  }
}
