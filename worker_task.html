<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baibesik — Жұмыс</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--orange:#f97316;--green:#10b981;--red:#ef4444;--purple:#7c3aed;--dark:#0f172a;--gray:#64748b;--border:#e2e8f0;--light:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;background:var(--light);min-height:100vh}
header{background:var(--dark);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:17px;font-weight:900;color:var(--orange);letter-spacing:1px;flex-shrink:0}
.hdr-mid{flex:1;min-width:0}
.w-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-role{font-size:10px;color:#94a3b8;margin-top:1px}
.logout{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;font-family:'Noto Sans',sans-serif;flex-shrink:0}
.page{max-width:480px;margin:0 auto;padding:16px}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-val{font-size:32px;font-weight:900;color:var(--orange)}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px;font-weight:700}

/* QR Card */
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;border:1px solid var(--border)}
.card-ttl{font-size:11px;font-weight:800;color:var(--gray);letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase}
#qr-reader{border-radius:10px;overflow:hidden;margin-bottom:12px}
.btn-scan{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:.2s;letter-spacing:.3px}
.btn-scan.open{background:var(--dark);color:#fff}
.btn-scan.close{background:var(--red);color:#fff}
.scan-hint{text-align:center;font-size:12px;color:var(--gray);margin-top:8px}

/* Result */
.result{background:#fff;border:2px solid var(--orange);border-radius:16px;padding:18px;margin-bottom:12px}
.r-num{font-size:20px;font-weight:900;color:var(--orange);margin-bottom:4px}
.r-cust{font-size:14px;font-weight:700;margin-bottom:2px}
.r-meta{font-size:12px;color:var(--gray);margin-bottom:12px}
.r-info{border-radius:10px;padding:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.r-info.cut{background:#fff7ed}
.r-info.pvc{background:#f5f3ff}
.r-info-lbl{font-size:11px;font-weight:700}
.r-info-val{font-size:22px;font-weight:900}
.btn-ok{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:'Noto Sans',sans-serif;letter-spacing:.3px}
.btn-ok.cut{background:var(--green);color:#fff}
.btn-ok.pvc{background:var(--purple);color:#fff}
.btn-ok.wait{background:#e2e8f0;color:var(--gray);cursor:not-allowed}
.btn-ok.done{background:#e2e8f0;color:var(--green);cursor:not-allowed}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:14px 28px;border-radius:30px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo" id="store-name">BAIBESIK</div>
  <div class="hdr-mid">
    <div class="w-name" id="w-name">—</div>
    <div class="w-role" id="w-role">—</div>
  </div>
  <button class="logout" onclick="doLogout()">🚪 Шығу</button>
</header>

<div class="page">
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="s-today">0</div>
      <div class="stat-lbl" id="s-today-lbl">Бүгін</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="s-month">0</div>
      <div class="stat-lbl" id="s-month-lbl">Осы ай</div>
    </div>
  </div>

  <div id="result-wrap"></div>

  <div class="card">
    <div class="card-ttl" id="qr-lbl">📷 QR КОД СКАННЕР</div>
    <div id="qr-reader" style="display:none"></div>
    <button class="btn-scan open" id="btn-scan" onclick="toggleScan()">📷 QR Сканнерді ашу</button>
    <div class="scan-hint">PDF-тен QR кодты нұсқаңыз</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const SB_URL='https://fciofuexujtxxjlamxno.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjaW9mdWV4dWp0eHhqbGFteG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTYwOTcsImV4cCI6MjA5NTczMjA5N30.dDvtfabQ6xHmSd5NDntme2ggJpzNKLtXovFFDW2Kc80';
const sb=createClient(SB_URL,SB_KEY);

let ME=null, ROLE=null, STORE=null, QR=null, SCANNING=false;

// Material type tespiti
function getMaterialType(material){
  if(!material) return 'ldsp';
  const m=material.toLowerCase();
  if(m.includes('hdf')||m.includes('хдф')) return 'hdf';
  if(m.includes('mdf')||m.includes('мдф')) return 'mdf';
  return 'ldsp';
}

// PVC metre hesaplama
function calcPvcM(parts){
  let total=0;
  (parts||[]).forEach(p=>{
    let per=0;
    if(p.e?.t)per+=p.w; if(p.e?.b)per+=p.w;
    if(p.e?.l)per+=p.h; if(p.e?.r)per+=p.h;
    total+=per*(p.qty||1);
  });
  return parseFloat((total/1000*1.05).toFixed(2));
}

const ROLE_CFG={
  cutting_worker:{
    label:'🪚 Пильный центр',
    pendingStatuses:['processing'],
    nextStatus:'cutting_done',
    taskType:'cutting',
    btnText:'✅ Кесу аяқталды',
    btnClass:'cut',
    todayLbl:'Бүгін / лист',
    monthLbl:'Айда / лист'
  },
  pvc_worker:{
    label:'🖌️ ПВХ покрытие',
    pendingStatuses:['cutting_done'],
    nextStatus:'pvc_done',
    taskType:'pvc',
    btnText:'✅ ПВХ аяқталды',
    btnClass:'pvc',
    todayLbl:'Бүгін / заказ',
    monthLbl:'Айда / заказ'
  }
};

function toast(msg,ms=2500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

// Sipariş kartı göster
async function showOrder(orderNum){
  const wrap=document.getElementById('result-wrap');
  wrap.innerHTML='<div class="card" style="text-align:center;color:var(--gray)">⏳ Іздеу...</div>';
  try{
    let q=sb.from('raskroi_orders').select('*').eq('order_number',orderNum);
    // Store filtresi — mümkünse uygula
    if(STORE) q=q.eq('store_id',STORE.id);
    const {data:o,error}=await q.maybeSingle();

    if(!o){
      // Store filtresi olmadan tekrar dene
      const {data:o2}=await sb.from('raskroi_orders').select('*').eq('order_number',orderNum).maybeSingle();
      if(!o2){wrap.innerHTML='<div class="card" style="color:var(--red);font-weight:700">❌ Тапсырыс табылмады</div>';return;}
      renderOrderCard(o2,wrap);
    } else {
      renderOrderCard(o,wrap);
    }
  }catch(e){
    wrap.innerHTML=`<div class="card" style="color:var(--red)">❌ ${e.message}</div>`;
  }
}

function renderOrderCard(o,wrap){
  const cfg=ROLE_CFG[ROLE];
  const matType=getMaterialType(o.material);
  const canAct=cfg.pendingStatuses.includes(o.status);
  const statOrder=['pending','processing','cutting_done','pvc_done','done'];
  const myStatIdx=statOrder.indexOf(cfg.nextStatus);
  const curStatIdx=statOrder.indexOf(o.status);
  const alreadyDone=curStatIdx>=myStatIdx;

  const sheets=o.sheets_used||1;
  const pvcM=calcPvcM(o.parts||[]);

  // Info block
  let infoHtml='';
  if(ROLE==='cutting_worker'){
    const matLabel=matType==='hdf'?'HDF':matType==='mdf'?'MDF':'ЛДСП';
    infoHtml=`<div class="r-info cut">
      <div><div class="r-info-lbl" style="color:#ea580c">🪚 Кесу / ${matLabel}</div><div style="font-size:11px;color:var(--gray)">${o.material||'—'}</div></div>
      <div class="r-info-val" style="color:#ea580c">${sheets} лист</div>
    </div>`;
  } else {
    infoHtml=`<div class="r-info pvc">
      <div><div class="r-info-lbl" style="color:var(--purple)">🖌️ ПВХ мөлшері</div><div style="font-size:11px;color:var(--gray)">${(o.parts||[]).reduce((s,p)=>{let e=p.e||{};return s+(e.t?1:0)+(e.b?1:0)+(e.l?1:0)+(e.r?1:0);},0)} жиек</div></div>
      <div class="r-info-val" style="color:var(--purple)">${pvcM} м</div>
    </div>`;
  }

  const qty=ROLE==='cutting_worker'?sheets:pvcM;

  wrap.innerHTML=`<div class="result">
    <div class="r-num">${o.order_number}</div>
    <div class="r-cust">${o.customer_name||'—'}</div>
    <div class="r-meta">${o.material||'ЛДСП'} · ${sheets} лист · ${(o.parts||[]).length} дет.</div>
    ${infoHtml}
    <button class="btn-ok ${alreadyDone?'done':canAct?cfg.btnClass:'wait'}"
      id="btn-complete"
      onclick="completeTask('${o.order_number}','${cfg.nextStatus}','${cfg.taskType}',${qty},'${matType}')"
      ${!canAct||alreadyDone?'disabled':''}>
      ${alreadyDone?'✅ Жасалған / Уже выполнено':canAct?cfg.btnText:'⏳ Алдыңғы кезеңді күтіңіз'}
    </button>
  </div>`;
}

window.completeTask=async function(orderNum,nextStatus,taskType,qty,matType){
  const btn=document.getElementById('btn-complete');
  if(btn){btn.disabled=true;btn.textContent='⏳ Сақталуда...';}
  try{
    await sb.from('raskroi_orders').update({status:nextStatus}).eq('order_number',orderNum);
    // Birden fazla store_id olabilir — store_id belirsizse de kaydet
    const storeId=STORE?.id||null;
    await sb.from('worker_tasks').insert({
      store_id:storeId,
      worker_id:ME.id,
      task_type:taskType,
      order_ref:orderNum,
      quantity:qty,
      unit:taskType==='cutting'?'лист':'м',
      unit_price:0,
      task_date:new Date().toISOString().slice(0,10),
      notes:matType!=='ldsp'?matType:null
    });
    if(navigator.vibrate) navigator.vibrate([100,50,200]);
    toast('✅ Тіркелді!');
    if(btn){btn.textContent='✅ Жасалған';btn.className='btn-ok done';}
    loadStats();
  }catch(e){
    toast('❌ '+e.message,4000);
    if(btn){btn.disabled=false;btn.textContent=ROLE_CFG[ROLE].btnText;}
  }
};

window.toggleScan=async function(){
  const btn=document.getElementById('btn-scan');
  const reader=document.getElementById('qr-reader');
  if(SCANNING){
    if(QR) await QR.stop().catch(()=>{});
    QR=null;SCANNING=false;
    reader.style.display='none';
    btn.textContent='📷 QR Сканнерді ашу';
    btn.className='btn-scan open';
    return;
  }
  SCANNING=true;
  btn.textContent='⏹ Тоқтату';
  btn.className='btn-scan close';
  reader.style.display='block';
  QR=new Html5Qrcode('qr-reader');
  try{
    await QR.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:250,height:250}},
      async(text)=>{
        // QR'dan order number çıkar
        let num='';
        const urlM=text.match(/[?&]order=([A-Z0-9-]+)/);
        const rskM=text.match(/RSK-[A-Z0-9]+/);
        if(urlM) num=urlM[1];
        else if(rskM) num=rskM[0];
        if(!num) return;
        await toggleScan();
        if(navigator.vibrate) navigator.vibrate(100);
        await showOrder(num);
        document.getElementById('result-wrap').scrollIntoView({behavior:'smooth',block:'center'});
      },
      ()=>{}
    );
  }catch(e){
    SCANNING=false;
    reader.style.display='none';
    btn.textContent='📷 QR Сканнерді ашу';
    btn.className='btn-scan open';
    if(e.toString().includes('ermission')) toast('Камераға рұқсат беріңіз!',4000);
  }
};

async function loadStats(){
  if(!ME) return;
  const today=new Date().toISOString().slice(0,10);
  const monthStart=today.slice(0,7)+'-01';
  const taskType=ROLE_CFG[ROLE].taskType;
  const [{data:td},{data:mn}]=await Promise.all([
    sb.from('worker_tasks').select('quantity').eq('worker_id',ME.id).eq('task_date',today).eq('task_type',taskType),
    sb.from('worker_tasks').select('quantity').eq('worker_id',ME.id).gte('task_date',monthStart).eq('task_type',taskType)
  ]);
  const sum=a=>(a||[]).reduce((s,r)=>s+parseFloat(r.quantity||0),0);
  document.getElementById('s-today').textContent=sum(td).toFixed(0);
  document.getElementById('s-month').textContent=sum(mn).toFixed(0);
}

window.doLogout=async function(){await sb.auth.signOut();window.location.href='login.html?staff=1';};

// INIT
(async()=>{
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){window.location.href='login.html?staff=1';return;}

    const {data:user}=await sb.from('users').select('*').eq('id',session.user.id).single();
    if(!user||!['cutting_worker','pvc_worker'].includes(user.role)){
      window.location.href='login.html?staff=1';return;
    }
    ME=user; ROLE=user.role;
    const cfg=ROLE_CFG[ROLE];

    document.getElementById('w-name').textContent=user.full_name||user.phone||'—';
    document.getElementById('w-role').textContent=cfg.label;
    document.getElementById('s-today-lbl').textContent=cfg.todayLbl;
    document.getElementById('s-month-lbl').textContent=cfg.monthLbl;

    // Store tespiti — subdomain VEYA store_members'dan
    try{
      const {getCurrentStore,applyStoreTheme}=await import('./supabase_client.js');
      STORE=await getCurrentStore();
      if(!STORE){
        // Subdomain yoksa store_members'dan bul
        const {data:m}=await sb.from('store_members')
          .select('store_id,stores(*)')
          .eq('user_id',ME.id).limit(1);
        if(m&&m.length) STORE=m[0].stores;
      }
      if(STORE) document.getElementById('store-name').textContent=STORE.name;
      await applyStoreTheme();
    }catch(e){}

    await loadStats();

    // URL'den direkt sipariş (QR ile gelindi)
    const urlOrder=new URLSearchParams(window.location.search).get('order');
    if(urlOrder) await showOrder(urlOrder);

  }catch(e){
    console.error(e);
    window.location.href='login.html?staff=1';
  }
})();
</script>
</body>
</html>
