<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baibesik Hırdavat - Тіркелу / Регистрация</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
        }
        
        /* Dil Seçimi */
        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 5px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: #e4e6eb;
            color: #333;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .lang-btn.active {
            background: #ff6b00;
            color: white;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area h1 {
            color: #ff6b00;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .logo-area p {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #ff6b00;
        }
        
        /* Şifre Alanı Görünürlük Ayarı */
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: auto;
            margin-top: 3px;
        }
        .checkbox-group label {
            font-weight: normal;
            font-size: 13px;
            line-height: 1.4;
            color: #555;
        }

        .btn-register {
            background-color: #ff6b00;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-register:hover {
            background-color: #e56000;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .login-link a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <!-- Dil Butonları -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLanguage('kk')">KK</button>
            <button class="lang-btn" onclick="switchLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="switchLanguage('tr')">TR</button>
        </div>

        <!-- Logo ve Başlık -->
        <div class="logo-area">
            <h1>BAIBESIK</h1>
            <p id="txt-subtitle">Ыңғайлы және жылдам тіркелу</p>
        </div>

        <!-- Kayıt Formu -->
        <form onsubmit="handleRegister(event)">
            <!-- Ad Soyad -->
            <div class="form-group">
                <label id="lbl-name">Аты-жөніңіз (FIO)</label>
                <input type="text" id="user-name" placeholder="Farabi..." required>
            </div>

            <!-- Telefon Numarası -->
            <div class="form-group">
                <label id="lbl-phone">Telephone number</label>
                <input type="tel" id="user-phone" placeholder="+7 (707) 123-45-67" value="+7 " required>
            </div>

            <!-- Şifre -->
            <div class="form-group">
                <label id="lbl-pass">Құпия сөз (Şifre)</label>
                <div class="password-wrapper">
                    <input type="password" id="user-password" required minlength="6">
                    <span class="toggle-password" onclick="togglePass()">👁️</span>
                </div>
            </div>

            <!-- Adres / Sokak Seçimi (Baibesik Bölgesi) -->
            <div class="form-group">
                <label id="lbl-address">Көшеңізді таңдаңыз (Адрес)</label>
                <select id="user-street" required>
                    <!-- JavaScript ile dinamik olarak yüklenecek -->
                </select>
            </div>

            <!-- Ev/Daire No -->
            <div class="form-group">
                <label id="lbl-building">Үй / Пәтер нөмірі</label>
                <input type="text" id="user-building" placeholder="12, 3" required>
            </div>

            <!-- Sözleşme Onayı -->
            <div class="checkbox-group">
                <input type="checkbox" id="user-agree" required>
                <label id="lbl-agree" for="user-agree">
                    Пайдалану шарттары мен құпиялылық саясатымен келісемін.
                </label>
            </div>

            <!-- Kayıt Butonu -->
            <button type="submit" id="btn-submit" class="btn-register">Тіркелу</button>
        </form>

        <!-- Giriş Yap Bağlantısı -->
        <div class="login-link" id="txt-footer">
            Тіркелгенсіз бе? <a href="#">Кіру</a>
        </div>
    </div>

    <script>
        // Üç Dilli Sözlük Verisi
        const dictionary = {
            kk: {
                subtitle: "Ыңғайлы және жылдам тіркелу",
                name: "Аты-жөніңіз (Тегі, Аты)",
                phone: "Телефон нөмірі",
                pass: "Құпия сөз (ең кемі 6 таңба)",
                address: "Байбесік ықшам ауданындағы көшеңіз",
                building: "Үй / Пәтер / Қабат нөмірі",
                agree: "Пайдалану шарттарымен және мәліметтерді өңдеумен келісемін.",
                submit: "Тіркелуді аяқтау",
                footer: "Тіркелгенсіз бе? <a href='#'>Кіру</a>",
                alertSuccess: "Құттықтаймыз! Тіркелу сәтті аяқталды."
            },
            ru: {
                subtitle: "Удобная и быстрая регистрация",
                name: "Ваше ФИО (Имя, Фамилия)",
                phone: "Номер телефона",
                pass: "Пароль (минимум 6 символов)",
                address: "Ваша улица в микрорайоне Байбесик",
                building: "Номер дома / квартиры / этаж",
                agree: "Я согласен с условиями использования и политикой конфиденциальности.",
                submit: "Зарегистрироваться",
                footer: "Уже зарегистрированы? <a href='#'>Войти</a>",
                alertSuccess: "Поздравляем! Регистрация успешно завершена."
            },
            tr: {
                subtitle: "Kolay ve Hızlı Kayıt Ol",
                name: "Adınız Soyadınız",
                phone: "Telefon Numaranız",
                pass: "Şifre (En az 6 karakter)",
                address: "Baibesik Mahallesindeki Sokağınız",
                building: "Bina / Daire / Kat Numarası",
                agree: "Kullanım şartlarını ve gizlilik sözleşmesini onaylıyorum.",
                submit: "Kayıt Ol",
                footer: "Zaten hesabınız var mı? <a href='#'>Giriş Yap</a>",
                alertSuccess: "Tebrikler! Kayıt işleminiz başarıyla tamamlandı."
            }
        };

        // Baibesik Bölgesi Sokak Listesi
        const streets = [
            { kk: "1-ші көше", ru: "1-я улица", tr: "1. Sokak" },
            { kk: "2-ші көше (Орталық)", ru: "2-я улица (Центральная)", tr: "2. Sokak (Merkez)" },
            { kk: "Ақжол көшесі", ru: "улица Акжол", tr: "Akjol Caddesi" },
            { kk: "Ынтымақ көшесі", ru: "улица Ынтымак", tr: "Yntymak Sokak" }
        ];

        let currentLang = 'kk';

        function switchLanguage(lang) {
            currentLang = lang;
            
            // Aktif dil butonunun görsel stilini güncelle
            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => {
                if(btn.innerText.toLowerCase() === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Form metinlerini dile göre eşitle
            document.getElementById('txt-subtitle').innerText = dictionary[lang].subtitle;
            document.getElementById('lbl-name').innerText = dictionary[lang].name;
            document.getElementById('lbl-phone').innerText = dictionary[lang].phone;
            document.getElementById('lbl-pass').innerText = dictionary[lang].pass;
            document.getElementById('lbl-address').innerText = dictionary[lang].address;
            document.getElementById('lbl-building').innerText = dictionary[lang].building;
            document.getElementById('lbl-agree').innerHTML = dictionary[lang].agree;
            document.getElementById('btn-submit').innerText = dictionary[lang].submit;
            document.getElementById('txt-footer').innerHTML = dictionary[lang].footer;

            // Sokak listesini (Dropdown) güncel dile göre temizleyip yeniden doldur
            const streetSelect = document.getElementById('user-street');
            streetSelect.innerHTML = '';
            streets.forEach((street, index) => {
                const opt = document.createElement('option');
                opt.value = `street_${index}`;
                opt.innerText = street[lang];
                streetSelect.appendChild(opt);
            });
        }

        // Şifre Göster/Gizle
        function togglePass() {
            const passInput = document.getElementById('user-password');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.innerText = "🔒";
            } else {
                passInput.type = "password";
                toggleIcon.innerText = "👁️";
            }
        }

        // Form Gönderildiğinde Çalışacak Kod
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            const selectedStreetText = document.getElementById('user-street').options[document.getElementById('user-street').selectedIndex].text;
            const building = document.getElementById('user-building').value;
            
            // Başarılı Kayıt Bildirimi
            alert(`${dictionary[currentLang].alertSuccess}\n\n👤: ${name}\n📞: ${phone}\n📍: ${selectedStreetText}, ${building}`);
        }

        // Sayfa ilk yüklendiğinde varsayılan dili (Kazakça) otomatik çalıştır
        window.onload = function() {
            switchLanguage('kk');
        };
    </script>
</body>
</html>
