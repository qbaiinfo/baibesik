<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baibesik.kz — Регистрация</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#f97316;--orange-dark:#c2410c;
  --dark:#0f172a;--dark2:#1e293b;--gray:#64748b;
  --green:#10b981;--red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;background:var(--dark);min-height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#0a1a0f 0%,#0f172a 50%,#1e293b 100%);z-index:0}

.top-bar{position:relative;z-index:10;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--orange);letter-spacing:2px;text-decoration:none}
.logo span{color:#fff}
.lang-btns{display:flex;gap:6px}
.lang-btn{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Noto Sans',sans-serif}
.lang-btn.active{background:var(--green);color:#fff;border-color:var(--green)}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:10}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.card-head{background:linear-gradient(135deg,var(--green) 0%,#059669 100%);padding:24px;text-align:center}
.card-icon{font-size:34px;margin-bottom:6px}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;letter-spacing:2px}
.card-sub{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
.card-body{padding:24px}

.steps{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.step-dot{width:28px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);transition:all .3s}
.step-dot.active{background:var(--green);width:36px}
.step-dot.done{background:rgba(16,185,129,.4)}

.step-sec{display:none}
.step-sec.active{display:block}
.step-title{font-size:13px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;text-align:center}

/* ROL GRID */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-chip{border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.04)}
.role-chip:hover{border-color:var(--green);background:rgba(16,185,129,.08)}
.role-chip.selected{border-color:var(--green);background:rgba(16,185,129,.15)}
.role-icon{font-size:28px;display:block;margin-bottom:8px}
.role-name{font-size:13px;font-weight:800;color:#fff}
.role-sub{font-size:11px;color:#64748b;margin-top:3px}
.role-chip.selected .role-name{color:var(--green)}

/* FORM */
.fg{margin-bottom:14px}
.fg-lbl{font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg-inp-wrap{position:relative}
.fg-inp{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;font-family:'Noto Sans',sans-serif;color:#fff;outline:none;transition:all .2s}
.fg-inp::placeholder{color:#475569}
.fg-inp:focus{border-color:var(--green)}
.fg-inp-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#64748b;cursor:pointer}
.phone-wrap{display:flex;gap:8px}
.phone-prefix{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;color:#94a3b8;font-size:14px;font-weight:700}

.ps-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin:6px 0 4px}
.ps-fill{height:100%;border-radius:2px;transition:all .3s;width:0}
.ps-text{font-size:11px;font-weight:700;color:#64748b}

.terms-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;padding:12px;background:rgba(255,255,255,.03);border-radius:8px;cursor:pointer}
.terms-check{width:20px;height:20px;border:1.5px solid rgba(255,255,255,.2);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;color:#fff}
.terms-check.checked{background:var(--green);border-color:var(--green)}
.terms-text{font-size:12px;color:#94a3b8;line-height:1.5}
.terms-text a{color:var(--green);text-decoration:none}

.btn-main{width:100%;background:linear-gradient(135deg,var(--green) 0%,#059669 100%);color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:all .2s;letter-spacing:.5px}
.btn-main:hover{opacity:.9}
.btn-main:disabled{opacity:.4;pointer-events:none}
.btn-ghost{background:rgba(255,255,255,.04);color:#94a3b8;border:1px solid rgba(255,255,255,.1);padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:all .2s}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}

.loading-ring{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.alert{border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:none;align-items:center;gap:8px}
.alert.show{display:flex}
.alert-error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.alert-success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#6ee7b7}

.success-screen{text-align:center;padding:24px 0;display:none}
.success-screen.show{display:block}
.success-icon{font-size:60px;margin-bottom:14px;animation:pop .4s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:1px;margin-bottom:8px}
.success-sub{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.6}

.link-row{text-align:center;margin-top:14px;font-size:13px;color:#64748b}
.link-row a{color:var(--green);text-decoration:none;font-weight:700}
footer{position:relative;z-index:10;text-align:center;padding:16px;font-size:11px;color:#334155}
</style>
</head>
<body>
<div class="bg"></div>

<div class="top-bar">
  <a href="index.html" class="logo">BAI<span>BESIK</span></a>
  <div class="lang-btns">
    <button class="lang-btn active" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('kk')">KK</button>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-head">
      <div class="card-icon">✨</div>
      <div class="card-title" id="card-title">РЕГИСТРАЦИЯ</div>
      <div class="card-sub" id="card-sub">Создайте аккаунт бесплатно</div>
    </div>
    <div class="card-body">

      <div class="steps" id="steps-wrap">
        <div class="step-dot active" id="dot-1"></div>
        <div class="step-dot" id="dot-2"></div>
        <div class="step-dot" id="dot-3"></div>
      </div>

      <div class="alert alert-error" id="alert-err">⚠️ <span id="alert-msg"></span></div>
      <div class="alert alert-success" id="alert-ok">✅ <span id="alert-ok-msg"></span></div>

      <!-- STEP 1 -->
      <div class="step-sec active" id="step-1">
        <div class="step-title" id="st1">ШАГ 1 — КТО ВЫ?</div>
        <div class="role-grid" id="role-grid"></div>
        <button class="btn-main" onclick="goStep(2)" id="btn-s1">Далее →</button>
      </div>

      <!-- STEP 2 -->
      <div class="step-sec" id="step-2">
        <div class="step-title" id="st2">ШАГ 2 — ЛИЧНЫЕ ДАННЫЕ</div>
        <div class="fg-row" style="margin-bottom:14px">
          <div class="fg">
            <label class="fg-lbl" id="lbl-fn">Имя</label>
            <input class="fg-inp" id="inp-fn" placeholder="Ерканат">
          </div>
          <div class="fg">
            <label class="fg-lbl" id="lbl-ln">Фамилия</label>
            <input class="fg-inp" id="inp-ln" placeholder="Жұмабай">
          </div>
        </div>
        <div class="fg">
          <label class="fg-lbl" id="lbl-ph">Номер телефона</label>
          <div class="phone-wrap">
            <div class="phone-prefix">+7</div>
            <input class="fg-inp" id="inp-ph" type="tel" placeholder="707 123 4567" maxlength="10" inputmode="numeric">
          </div>
        </div>
        <div class="fg">
          <label class="fg-lbl" id="lbl-city">Город / Район</label>
          <input class="fg-inp" id="inp-city" placeholder="Алматы, мкр. Байбесик">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost" onclick="goStep(1)" id="btn-b1" style="flex:1">← Назад</button>
          <button class="btn-main" onclick="goStep(3)" id="btn-s2" style="flex:2">Далее →</button>
        </div>
      </div>

      <!-- STEP 3 -->
      <div class="step-sec" id="step-3">
        <div class="step-title" id="st3">ШАГ 3 — ПАРОЛЬ</div>
        <div class="fg">
          <label class="fg-lbl" id="lbl-pw">Пароль</label>
          <div class="fg-inp-wrap">
            <input class="fg-inp" id="inp-pw" type="password" placeholder="min. 6 символов" oninput="checkStr()">
            <span class="fg-inp-icon" onclick="togglePw('inp-pw')">👁</span>
          </div>
          <div class="ps-bar"><div class="ps-fill" id="ps-fill"></div></div>
          <div class="ps-text" id="ps-text"></div>
        </div>
        <div class="fg">
          <label class="fg-lbl" id="lbl-pw2">Повторите пароль</label>
          <div class="fg-inp-wrap">
            <input class="fg-inp" id="inp-pw2" type="password" placeholder="••••••••">
            <span class="fg-inp-icon" onclick="togglePw('inp-pw2')">👁</span>
          </div>
        </div>
        <div class="terms-row" onclick="toggleTerms()">
          <div class="terms-check" id="terms-chk"></div>
          <div class="terms-text" id="terms-txt">Я согласен с <a href="#">условиями использования</a> Baibesik.kz</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost" onclick="goStep(2)" id="btn-b2" style="flex:1">← Назад</button>
          <button class="btn-main" id="btn-reg" onclick="doRegister()" style="flex:2">
            <span id="btn-reg-txt">Создать аккаунт →</span>
          </button>
        </div>
      </div>

      <!-- SUCCESS -->
      <div class="success-screen" id="suc-screen">
        <div class="success-icon">🎉</div>
        <div class="success-title" id="suc-title">АККАУНТ СОЗДАН!</div>
        <div class="success-sub" id="suc-sub">Добро пожаловать! Перенаправляем...</div>
        <button class="btn-main" onclick="window.location.href='login.html'" id="btn-go-login">Войти сейчас →</button>
      </div>

      <div class="link-row" id="login-row">
        <span id="have-acc">Уже есть аккаунт?</span> <a href="login.html" id="login-lnk">Войти</a>
      </div>

    </div>
  </div>
</div>
<footer>© 2026 Baibesik.kz</footer>

<script>
// ─── CONFIG — BURAYA KENDİ KEY'İNİ YAZ ───────────────────────────────────
const SUPABASE_URL = 'https://fciofuexujtxxjlamxno.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjaW9mdWV4dWp0eHhqbGFteG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTYwOTcsImV4cCI6MjA5NTczMjA5N30.dDvtfabQ6xHmSd5NDntme2ggJpzNKLtXovFFDW2Kc80'; // eyJ... ile başlayan key
// ─────────────────────────────────────────────────────────────────────────

const ROLES = [
  {id:'customer',  icon:'🛒', ru:'Покупатель',  kk:'Сатып алушы',  sub_ru:'Розничный',        sub_kk:'Бөлшек'},
  {id:'wholesale', icon:'📦', ru:'Оптовик',     kk:'Көтермеші',    sub_ru:'Оптовый',          sub_kk:'Көтерме'},
  {id:'manager',   icon:'🏪', ru:'Менеджер',    kk:'Менеджер',     sub_ru:'Сотрудник магазина',sub_kk:'Дүкен қызметкері'},
  {id:'warehouse', icon:'🏭', ru:'Склад',       kk:'Қойма',        sub_ru:'Складской',        sub_kk:'Қойма жұмысшысы'},
];

const ROUTES = {
  customer:'musteri_dashboard.html', wholesale:'toptanci_dashboard.html',
  manager:'vendor.html', warehouse:'depo_panel.html',
};

const T = {
  ru:{
    'card-title':'РЕГИСТРАЦИЯ','card-sub':'Создайте аккаунт бесплатно',
    'st1':'ШАГ 1 — КТО ВЫ?','st2':'ШАГ 2 — ЛИЧНЫЕ ДАННЫЕ','st3':'ШАГ 3 — ПАРОЛЬ',
    'lbl-fn':'Имя','lbl-ln':'Фамилия','lbl-ph':'Номер телефона',
    'lbl-city':'Город / Район','lbl-pw':'Пароль','lbl-pw2':'Повторите пароль',
    'btn-s1':'Далее →','btn-s2':'Далее →','btn-b1':'← Назад','btn-b2':'← Назад',
    'btn-reg-txt':'Создать аккаунт →','btn-go-login':'Войти сейчас →',
    'suc-title':'АККАУНТ СОЗДАН!','suc-sub':'Добро пожаловать! Перенаправляем...',
    'have-acc':'Уже есть аккаунт?','login-lnk':'Войти',
    'terms-txt':'Я согласен с условиями использования Baibesik.kz',
    err_fill:'Заполните все поля',err_phone:'Введите 10-значный номер',
    err_pass:'Пароль минимум 6 символов',err_match:'Пароли не совпадают',
    err_terms:'Примите условия использования',err_exists:'Пользователь уже зарегистрирован',
    ps_weak:'Слабый',ps_med:'Средний',ps_strong:'Надёжный',
    ok_reg:'Аккаунт создан! Перенаправляем...',
  },
  kk:{
    'card-title':'ТІРКЕЛУ','card-sub':'Тегін аккаунт жасаңыз',
    'st1':'1-ҚАДАМ — СІЗ КІМСІЗ?','st2':'2-ҚАДАМ — ЖЕКЕ ДЕРЕКТЕР','st3':'3-ҚАДАМ — ҚҰПИЯ СӨЗ',
    'lbl-fn':'Аты','lbl-ln':'Тегі','lbl-ph':'Телефон нөмірі',
    'lbl-city':'Қала / Аудан','lbl-pw':'Құпия сөз','lbl-pw2':'Қайталаңыз',
    'btn-s1':'Келесі →','btn-s2':'Келесі →','btn-b1':'← Артқа','btn-b2':'← Артқа',
    'btn-reg-txt':'Аккаунт жасау →','btn-go-login':'Қазір кіру →',
    'suc-title':'АККАУНТ ЖАСАЛДЫ!','suc-sub':'Қош келдіңіз! Бағытталуда...',
    'have-acc':'Аккаунт бар ма?','login-lnk':'Кіру',
    'terms-txt':'Baibesik.kz пайдалану шарттарымен келісемін',
    err_fill:'Барлық өрістерді толтырыңыз',err_phone:'10 санды нөмір енгізіңіз',
    err_pass:'Кем дегенде 6 таңба',err_match:'Құпия сөздер сәйкес емес',
    err_terms:'Шарттарды қабылдаңыз',err_exists:'Пайдаланушы бұрын тіркелген',
    ps_weak:'Әлсіз',ps_med:'Орташа',ps_strong:'Сенімді',
    ok_reg:'Аккаунт жасалды! Бағытталуда...',
  }
};

let lang='ru', selRole='customer', termsOk=false;

function d(){return T[lang];}
function $(id){return document.getElementById(id);}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===l));
  ['card-title','card-sub','st1','st2','st3','lbl-fn','lbl-ln','lbl-ph','lbl-city',
   'lbl-pw','lbl-pw2','btn-s1','btn-s2','btn-b1','btn-b2','btn-reg-txt',
   'btn-go-login','suc-title','suc-sub','have-acc','login-lnk','terms-txt'].forEach(k=>{
    const el=$(k);if(el)el.textContent=d()[k]||'';
  });
  renderRoles();
}

function renderRoles(){
  $('role-grid').innerHTML=ROLES.map(r=>`
    <div class="role-chip${selRole===r.id?' selected':''}" onclick="selRole='${r.id}';renderRoles()">
      <span class="role-icon">${r.icon}</span>
      <div class="role-name">${lang==='ru'?r.ru:r.kk}</div>
      <div class="role-sub">${lang==='ru'?r.sub_ru:r.sub_kk}</div>
    </div>`).join('');
}

function goStep(s){
  const d_=d();
  hideAlerts();
  if(s===3){
    const fn=$('inp-fn').value.trim();
    const ph=$('inp-ph').value.replace(/\D/g,'');
    if(!fn||!ph){showErr(d_.err_fill);return;}
    if(ph.length<10){showErr(d_.err_phone);return;}
  }
  [1,2,3].forEach(i=>{
    $('step-'+i).className='step-sec'+(i===s?' active':'');
    const dot=$('dot-'+i);
    dot.className='step-dot'+(i===s?' active':i<s?' done':'');
  });
}

function toggleTerms(){
  termsOk=!termsOk;
  $('terms-chk').classList.toggle('checked',termsOk);
  $('terms-chk').textContent=termsOk?'✓':'';
}

function togglePw(id){const el=$(id);el.type=el.type==='password'?'text':'password';}

function checkStr(){
  const v=$('inp-pw').value;
  const fill=$('ps-fill'),txt=$('ps-text'),d_=d();
  if(!v){fill.style.width='0';txt.textContent='';return;}
  let sc=0;
  if(v.length>=6)sc++;if(v.length>=10)sc++;
  if(/[A-Z]/.test(v))sc++;if(/[0-9]/.test(v))sc++;if(/[^A-Za-z0-9]/.test(v))sc++;
  const lvl=sc<=2?[33,'#ef4444',d_.ps_weak]:sc<=3?[66,'#f59e0b',d_.ps_med]:[100,'#10b981',d_.ps_strong];
  fill.style.width=lvl[0]+'%';fill.style.background=lvl[1];
  txt.style.color=lvl[1];txt.textContent=lvl[2];
}

function showErr(msg){$('alert-msg').textContent=msg;$('alert-err').classList.add('show');$('alert-ok').classList.remove('show');}
function showOk(msg){$('alert-ok-msg').textContent=msg;$('alert-ok').classList.add('show');$('alert-err').classList.remove('show');}
function hideAlerts(){$('alert-err').classList.remove('show');$('alert-ok').classList.remove('show');}

async function doRegister(){
  const d_=d();
  const fn=$('inp-fn').value.trim();
  const ln=$('inp-ln').value.trim();
  const ph=$('inp-ph').value.replace(/\D/g,'');
  const city=$('inp-city').value.trim();
  const pw=$('inp-pw').value;
  const pw2=$('inp-pw2').value;

  hideAlerts();
  if(!fn||!ph){showErr(d_.err_fill);return;}
  if(ph.length<10){showErr(d_.err_phone);return;}
  if(pw.length<6){showErr(d_.err_pass);return;}
  if(pw!==pw2){showErr(d_.err_match);return;}
  if(!termsOk){showErr(d_.err_terms);return;}

  const btn=$('btn-reg');
  btn.disabled=true;
  $('btn-reg-txt').innerHTML='<span class="loading-ring"></span>';

  try{
    // Supabase SDK dinamik yükle
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);

    const fullName=`${fn} ${ln}`.trim();
    const email=ph+'@baibesik.kz';

    const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:fullName,phone:'+7'+ph,city}}});

    if(error){
      if(error.message.includes('already'))showErr(d_.err_exists);
      else showErr(error.message);
      btn.disabled=false;$('btn-reg-txt').textContent=d_['btn-reg-txt'];
      return;
    }

    if(data.user){
      await sb.from('users').insert({
        id:data.user.id,phone:'+7'+ph,full_name:fullName,role:selRole
      });
    }

    // Success
    $('steps-wrap').style.display='none';
    ['step-1','step-2','step-3'].forEach(id=>$(id).className='step-sec');
    $('login-row').style.display='none';
    $('suc-screen').classList.add('show');

    setTimeout(()=>{window.location.href=ROUTES[selRole]||'musteri_dashboard.html';},2000);

  }catch(e){
    showErr(e.message||'Ошибка подключения');
    btn.disabled=false;
    $('btn-reg-txt').textContent=d()['btn-reg-txt'];
  }
}

document.getElementById('inp-ph').addEventListener('input',function(){
  this.value=this.value.replace(/\D/g,'').slice(0,10);
});

renderRoles();
